[MODELS]
; Choose transcription engine: whisper or moonshine
engine=

; Whisper model path (used when engine=whisper)
whisper_model=models/whisper/ggml-model.bin

; Moonshine model path (used when engine=moonshine)
moonshine_model=models/moonshine/

[TRANSCRIPTION]
; Whisper confidence threshold (0.0-1.0, higher = stricter)
whisper_confidence_threshold=0.65

; Moonshine duration threshold (seconds, minimum speech duration)
moonshine_duration_threshold=0.3

; TEN VAD threshold (0.0-1.0, used by both models)
moonshine_vad_threshold=0.5

[PATH]
game_binding_path=

[DIRECT_INPUT_CONTROLLER]
XBOX_X=0
XBOX_A=1
XBOX_B=2
XBOX_Y=3
XBOX_LB=4
XBOX_RB=5
XBOX_BACK=8
XBOX_START=9
XBOX_LS=10
XBOX_RS=11
XBOX_GUIDE=12

[AUDIO]
; Saved audio device preferences
selected_device_name=
selected_device_api=
device_list_hash=

[PREFERENCES]
; First-run configuration status
first_run_complete=false
; Auto-launch game before listening
auto_launch_game=false

[VR]
debug_logging=false

[SPELL_TRANSMITTER]
enabled=true
debug_logging=false

[GAME]
; Path to Hogwarts Legacy Win64 folder (leave empty for auto-detection)
game_path=
; Auto-install/update UE4SS and SpellCaster mod on startup
auto_install_ue4ss=true

[CROWDSOURCING]
; Enable voice data crowdsourcing feature
enabled=true
consent_given=false
first_run_complete=false

; Authentication (choose 'account' or 'anonymous')
auth_type=anonymous
uuid=

; Optional metadata
nationality=
gender=

; Server configuration
server_host=hogwartslegacyspellcaster.xyz
auto_sync=true
debug_logging=false

; Storage paths (auto-detected if empty)
pending_folder=
synced_folder=
